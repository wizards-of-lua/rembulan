plugins {
  id 'java-library'
  id 'maven-publish'
  id 'eclipse'
}

allprojects {
  group = 'net.wizardsoflua.rembulan'
  version = '0.5.4'
}

// The release goes to build/release/: a Maven repository of all modules in maven/ and
// release.properties with the version (the contract with the release build service).
def releaseDir = layout.buildDirectory.dir('release')

subprojects {
  apply plugin: 'java-library'
  apply plugin: 'maven-publish'
  apply plugin: 'eclipse'

  java {
    toolchain {
      languageVersion = JavaLanguageVersion.of(8)
    }
  }

  repositories {
    mavenLocal()
    mavenCentral()
  }

  tasks.register('sourceJar', Jar) {
    archiveClassifier.set('sources')
    from(sourceSets.main.allSource)
  }

  tasks.register('javadocJar', Jar) {
    archiveClassifier.set('javadoc')
    from(tasks.javadoc)
  }

  // Every jar carries the licence (Apache-2.0 asks that it goes with every copy).
  tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE.txt')) {
      into('META-INF')
    }
  }

  tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
  }

  tasks.withType(Javadoc).configureEach {
    options.encoding   = 'UTF-8'
    options.docEncoding= 'UTF-8'
    options.charSet    = 'UTF-8'
  }

  publishing {
    publications {
      mavenJava(MavenPublication) {
        from(components.java)
        artifact(tasks.named('sourceJar'))
        artifact(tasks.named('javadocJar'))
      }
    }
    repositories {
      maven {
        url = uri(findProperty('repoUrl') ?: 'https://repo.maven.apache.org/maven2')
        credentials {
          username = findProperty('repoUser')
          password = findProperty('repoPass')
        }
      }
      maven {
        name = 'release'
        url = releaseDir.map { it.dir('maven') }
      }
    }
  }

  // Nothing lands in build/release/ before every module is built and tested.
  tasks.matching { it.name == 'publishMavenJavaPublicationToReleaseRepository' }.configureEach {
    mustRunAfter ':cleanRelease'
    mustRunAfter rootProject.subprojects.collect { "${it.path}:build" }
  }
}

tasks.register('cleanRelease', Delete) {
  delete releaseDir
}

tasks.register('release') {
  group = 'publishing'
  description = 'Builds and tests all modules and writes the release to build/release/.'
  dependsOn 'cleanRelease'
  dependsOn subprojects.collect { "${it.path}:build" }
  dependsOn subprojects.collect { "${it.path}:publishMavenJavaPublicationToReleaseRepository" }
  def releaseVersion = version.toString()
  def propertiesFile = releaseDir.map { it.file('release.properties') }
  doLast {
    propertiesFile.get().asFile.text = "version=${releaseVersion}\n"
  }
}

